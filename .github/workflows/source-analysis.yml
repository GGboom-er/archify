name: Source analysis

on:
  push:
    paths:
      - 'archify/analysis/**'
      - 'archify/bin/archify.mjs'
      - 'archify/bin/analyze.mjs'
      - 'archify/bin/trace.mjs'
      - 'archify/test/source*'
      - '.github/workflows/source-analysis.yml'
  pull_request:
    paths:
      - 'archify/analysis/**'
      - 'archify/bin/archify.mjs'
      - 'archify/bin/analyze.mjs'
      - 'archify/bin/trace.mjs'
      - 'archify/test/source*'
      - '.github/workflows/source-analysis.yml'

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s archify/test -p source_analysis_test.py
      - run: python -m unittest discover -s archify/test -p source_runtime_test.py
      - name: Select the provisioned interpreter
        shell: bash
        run: python -c 'import os,sys; f=open(os.environ["GITHUB_ENV"],"a"); f.write("ARCHIFY_PYTHON="+sys.executable+"\n"); f.close()'
      - run: node --test archify/test/source-analysis.test.mjs
